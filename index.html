<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PropertyWize Demo</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #v { width: 100vw; height: 100vh; object-fit: contain; background: #000; display: block; }
  #tap {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.72); color: #fff; font: 600 22px/1.4 system-ui, sans-serif;
    text-align: center; cursor: pointer; z-index: 10; padding: 24px;
  }
  #tap[hidden] { display: none; }
  #tap .card { border: 2px solid #7ab929; border-radius: 14px; padding: 28px 36px; background: #111; }
</style>
</head>
<body>
<video id="v" playsinline muted autoplay preload="auto">
  <source src="demo-video-720p.mp4" type="video/mp4">
</video>
<div id="tap" hidden>
  <div class="card">&#128266; Tap anywhere<br>to enable sound</div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  // ?sound=off -> muted playback (Stan narrates live over the slides)
  // default    -> attempt with sound (video narrates itself)
  var wantSound = params.get('sound') !== 'off';
  var startAt = parseFloat(params.get('t') || '0');
  var v = document.getElementById('v');
  var tap = document.getElementById('tap');

  function showTap() {
    tap.hidden = false;
    var unmute = function () {
      v.muted = false;
      v.play().catch(function(){});
      tap.hidden = true;
      document.body.removeEventListener('click', unmute);
    };
    document.body.addEventListener('click', unmute);
  }

  if (startAt > 0) {
    v.addEventListener('loadedmetadata', function () {
      if (startAt < v.duration) v.currentTime = startAt;
    }, { once: true });
  }

  if (wantSound) {
    // Muted autoplay is already running via the markup attributes.
    // Try to bring sound up; without a user gesture the browser blocks
    // it, so stay muted and offer tap-to-unmute instead.
    v.muted = false;
    v.play().then(function () {
      if (v.muted) showTap();
    }).catch(function () {
      v.muted = true;
      v.play().catch(function(){});
      showTap();
    });
  }
  // ?sound=off: the muted+autoplay markup attributes already handle it.

  // Autoplay watchdog: headless/bot browsers (e.g. Recall.ai's screenshare
  // renderer) sometimes leave the video paused even with muted+autoplay.
  // Keep nudging play() until frames are actually advancing.
  function kick() {
    if (v.ended) return;
    try {
      if (v.paused && v.readyState >= 2) {
        v.play().then(function(){ lastPlay = 'ok'; }, function(e){ lastPlay = 'rej:' + (e && e.name); });
      }
    } catch (e) { lastPlay = 'throw'; }
  }
  v.addEventListener('canplay', kick);
  v.addEventListener('pause', function () { setTimeout(kick, 500); });
  document.addEventListener('visibilitychange', kick);
  setInterval(kick, 1500);
  kick();

  // Debug overlay (?debug=1): live video state readout for diagnosing
  // headless/bot browsers. Shows in the top-left of the shared screen.
  if (params.get('debug') === '1') {
    var dbg = document.createElement('div');
    var lastPlay = 'n/a';
    dbg.style.cssText = 'position:fixed;top:8px;left:8px;z-index:20;background:rgba(0,0,0,.85);color:#0f0;font:14px/1.5 monospace;padding:8px 10px;white-space:pre;';
    document.body.appendChild(dbg);
    setInterval(function () {
      var err = v.error ? v.error.code : 'none';
      var src = v.currentSrc || 'none';
      dbg.textContent =
        't=' + v.currentTime.toFixed(1) + 's' +
        ' paused=' + v.paused +
        ' muted=' + v.muted +
        ' readyState=' + v.readyState +
        ' networkState=' + v.networkState +
        ' err=' + err +
        ' lastPlay=' + lastPlay +
        '\nbuffered=' + (v.buffered.length ? v.buffered.end(v.buffered.length - 1).toFixed(1) + 's' : '0s') +
        ' src=...' + src.slice(-34);
    }, 1000);
  }
})();
</script>
</body>
</html>
